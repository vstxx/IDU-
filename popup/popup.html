<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDU+</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header>
      <div class="logo">IDU+</div>
      <div>
        <h1>IDU+</h1>
        <p>Modernizacja s19.idu.edu.pl</p>
      </div>
    </header>

    <label class="switch-row">
      <span>
        <strong>Redesign</strong>
        <small>Włącza lub wyłącza nakładkę CSS/JS.</small>
      </span>
      <input id="enabled" type="checkbox">
    </label>

    <label class="field">
      <span>Gęstość interfejsu</span>
      <select id="density">
        <option value="compact">Compact</option>
        <option value="comfortable">Comfortable</option>
      </select>
    </label>

    <label class="switch-row">
      <span>
        <strong>Mobile cards</strong>
        <small>Lepszy układ wiadomości/ocen na telefonie.</small>
      </span>
      <input id="mobileCards" type="checkbox">
    </label>

    <footer>
      <button id="reset" type="button">Reset</button>
      <span id="status" aria-live="polite"></span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
